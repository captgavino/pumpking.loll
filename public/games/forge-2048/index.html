<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2048 Forge</title>
  <link rel="stylesheet" href="../shared.css" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="shell narrow">
    <div class="hud">
      <div class="hud-group">
        <div class="stat">Score <strong id="score" class="accent">0</strong></div>
        <div class="stat">Best <strong id="best">0</strong></div>
      </div>
      <div class="hud-actions">
        <button id="undoBtn" type="button" class="btn-secondary" disabled>Undo</button>
        <button id="restartBtn" type="button" class="btn-secondary">Restart</button>
      </div>
    </div>

    <div class="stage">
      <div id="board" class="board"></div>
      <div id="overlay" class="overlay hidden">
        <h1 id="overlayTitle">No Moves Left</h1>
        <p id="overlayDesc"></p>
        <button id="againBtn" type="button" class="btn-primary">Play Again</button>
      </div>
    </div>
  </div>
  <script src="../theme-sync.js"></script>
  <script src="./game.js"></script>
</body>
</html>
